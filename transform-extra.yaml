# ======= Aligning nrf52/nrf53 with nrf54 gpiote
  - !MakeRegisterArray
      blocks: gpiote::Gpiote
      from: inten(.+)
      to: inten$1
  - !MakeRegisterArray
      blocks: gpiote::Gpiote
      from: events_port
      to: events_port
# ======= Aligning nrf52/nrf53 with nrf54 pwm
  - !MakeBlock
      blocks: pwm::Pwm
      from: seq
      to_outer: dma
      to_inner: seq
      to_block: pwm::Dma
  - !Rename
      from: pwm::Seq
      to: pwm::DmaSeq
  - !RenameRegisters
      block: pwm::DmaSeq
      from: cnt
      to: maxcnt
  - !MakeBlock
      blocks: pwm::Pwm
      from: tasks_seqstart
      to_outer: tasks_dma
      to_inner: seqstart
      to_block: pwm::TasksDma
  - !MakeBlock
      blocks: pwm::TasksDma
      from: seqstart
      to_inner: start
      to_outer: seq
      to_block: pwm::TasksDmaSeq
      array_on_outer: true
  - !RenameFields
      fieldset: .*::regs::Shorts.*
      from: loopsdone_seqstart0
      to: loopsdone_dma_seq0_start
# ======= Aligning nrf52/nrf53 fieldset and enum names with nrf54
  - !Rename
      from: (spim|spis|twim|twis|uarte)::regs::Rxd([A-Z].*)
      to: $1::regs::Rx$2
      type: Fieldset
  - !Rename
      from: (spim|spis|twim|twis|uarte)::regs::Txd([A-Z].*)
      to: $1::regs::Tx$2
      type: Fieldset
  - !Rename
      from: (spim|spis|twim|twis)::vals::RxdListList
      to: $1::vals::RxListType
      type: Enum
  - !Rename
      from: (spim|spis|twim|twis)::vals::TxdListList
      to: $1::vals::TxListType
      type: Enum
  - !RenameFields
      fieldset: (spim|spis|twim|twis)::regs::(Rx|Tx)List
      from: list
      to: type_
  - !Rename
      from: spim::regs::Config
      to: spim::regs::SpimConfig
      type: Fieldset
  - !Rename
      from: spis::regs::Config
      to: spis::regs::SpisConfig
      type: Fieldset
  - !Rename
      from: twis::regs::Config
      to: twis::regs::TwisConfig
      type: Fieldset
  - !Rename
      from: twis::regs::Match
      to: twis::regs::TwisMatch
      type: Fieldset
  - !Rename
      from: uarte::regs::Config
      to: uarte::regs::UarteConfig
      type: Fieldset
  - !Rename
      from: uarte::vals::Stop
      to: uarte::vals::ConfigStop
      type: Enum
  - !Rename
      from: pwm::regs::Cnt
      to: pwm::regs::Maxcnt
      type: Fieldset
  - !RenameFields
      fieldset: pwm::regs::Maxcnt
      from: cnt
      to: maxcnt
  - !DeleteEnums
      from: pwm::vals::CntCnt
# ======= Aligning nrf52/nrf53 with nrf54 nfct
  - !MakeBlock
      blocks: nfct::Nfct
      from: nfcid1_(last|2nd_last|3rd_last)
      to_outer: nfcid1
      to_inner: $1
      to_block: nfct::Nfcid1
  - !RenameRegisters
      block: nfct::Nfcid1
      from: 2nd_last
      to: secondlast
  - !RenameRegisters
      block: nfct::Nfcid1
      from: 3rd_last
      to: thirdlast
  - !Rename
      from: nfct::regs::Nfcid1Last
      to: nfct::regs::Last
      type: Fieldset
  - !Rename
      from: nfct::regs::Nfcid12ndLast
      to: nfct::regs::Secondlast
      type: Fieldset
  - !Rename
      from: nfct::regs::Nfcid13rdLast
      to: nfct::regs::Thirdlast
      type: Fieldset
  - !RenameFields
      fieldset: nfct::regs::(Last|Secondlast|Thirdlast)
      from: nfcid1_(.)
      to: $1
