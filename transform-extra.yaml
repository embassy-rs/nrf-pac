# ======= Aligning nrf52/nrf53 with nrf54
  - !RenameFields
      fieldset: .*::regs::Shorts.*
      from: lastrx_starttx
      to: lastrx_dma_tx_start
  - !RenameFields
      fieldset: .*::regs::Shorts.*
      from: lasttx_startrx
      to: lasttx_dma_rx_start
# ======= Aligning nrf52/nrf53 with nrf54 spim
  - !MakeBlock
      blocks: spim::Spim
      from: (txd|rxd)
      to_outer: dma
      to_inner: $1$2
      to_block: spim::Dma
  - !RenameRegisters
      block: spim::Dma
      from: rxd
      to: rx
  - !RenameRegisters
      block: spim::Dma
      from: txd
      to: tx
  - !Rename
      from: spim::Txd
      to: spim::DmaTx
  - !Rename
      from: spim::Rxd
      to: spim::DmaRx
  - !MakeBlock
      blocks: spim::Spim
      from: tasks_(.+)(tx|rx)
      to_outer: tasks_dma
      to_inner: $1$2
      to_block: spim::TasksDma
  - !MakeBlock
      blocks: spim::TasksDma
      from: (.+)tx
      to_outer: tx
      to_inner: $1
      to_block: spim::TasksDmaTx
  - !MakeBlock
      blocks: spim::TasksDma
      from: (.+)rx
      to_outer: rx
      to_inner: $1
      to_block: spim::TasksDmaRx
